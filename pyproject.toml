[project]
name = "statementrows"
version = "0.1.0"
description = "Bank and credit card statement PDFs to Excel, every row checked against the statement's own running balance and totals."
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11", "openpyxl>=3.1", "typer>=0.12"]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab>=4"]
ocr = ["rapidocr-onnxruntime>=1.2"]

[project.scripts]
statementrows = "statementrows.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["statementrows"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
